<style>
  /* 全画面の3D射撃場。暗い半透明の計器パネルを画面の角に置く単一テーマ */
  :root {
    color-scheme: dark;
    --hud-fg: #eef0e8;

  }
  html, body {

    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
    -webkit-touch-callout: none; color: var(--hud-fg);
  }
  canvas { display: block; }
  #scope { position: fixed; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); pointer-events: none; will-change: transform; }
  #scope[hidden] { display: none; }
  #flash {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse 60% 45% at 50% 78%, rgba(255,190,110,0.85), rgba(255,140,60,0.35) 45%, rgba(0,0,0,0) 75%);
    mix-blend-mode: screen;
  }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel {
    position: absolute; background: var(--hud-bg); border: 1px solid var(--hud-line);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.5;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #leftcol { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #leftcol .panel { position: static; }
  #info b { color: var(--accent); font-weight: 600; }
  #modeBtn {
    pointer-events: auto; font: inherit; font-size: 12px; color: var(--hud-fg); background: transparent;
    border: 1px solid var(--hud-line); border-radius: 6px; padding: 2px 8px;
  }
  #pos b { color: var(--accent); }
  #status {
    top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));

  #ammo { font-family: var(--num); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }

  #mag { font-family: var(--num); }
  #wind { margin-top: 2px; font-variant-numeric: tabular-nums; }
  #windArrow { display: inline-block; color: var(--accent); font-weight: 700; transition: transform 0.4s; }
  #shot { font-variant-numeric: tabular-nums; }
  #shot b { color: var(--accent); }
  #shot .row { font-family: var(--num); font-size: 12px; }
  #cross {
    position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
    border-radius: 50%; background: var(--hud-fg); box-shadow: 0 0 2px #000;
  }
  #stick-base {
    position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid var(--hud-line); background: rgba(20,22,18,0.25); display: none;
  }
  #stick-knob {
    position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(244,241,234,0.55); display: none;
  }
  #help {
    bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    white-space: nowrap; opacity: 0.85;
  }
  .btn {
    position: absolute; pointer-events: auto; border-radius: 50%;
    background: var(--btn-bg); border: 2px solid var(--hud-line); color: var(--hud-fg);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; line-height: 1.1;
    font-family: inherit; text-align: center; padding: 0; -webkit-tap-highlight-color: transparent;
  }
  .btn:active, .btn.on { background: var(--btn-on); color: #1d1f1b; }
  #fire {
    width: 84px; height: 84px; font-size: 15px;
    right: calc(max(16px, env(safe-area-inset-right)) + 8px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 8px);
    border-color: rgba(232, 176, 74, 0.8);
  }
  #ads { width: 60px; height: 60px; right: calc(max(16px, env(safe-area-inset-right)) + 104px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 18px); }
  #reload { width: 52px; height: 52px; font-size: 11px; right: calc(max(16px, env(safe-area-inset-right)) + 176px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 22px); }
  #zoom {
    position: absolute; pointer-events: auto; right: max(12px, env(safe-area-inset-right));
    top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  #zoom[hidden] { display: none; }
  #zoom .btn { position: static; width: 46px; height: 46px; font-size: 22px; }
  #zoomv { font-family: var(--num); font-size: 13px; background: var(--hud-bg); padding: 2px 6px; border-radius: 6px; }
  #ammoBtn {
    pointer-events: auto; font: inherit; font-family: var(--num); font-size: 12px; color: var(--hud-fg);
    background: transparent; border: 1px solid var(--hud-line); border-radius: 6px; padding: 2px 6px; margin-top: 2px;
  }
  #ammoBtn b { color: var(--accent); font-weight: 600; }
  #dial {
    position: absolute; pointer-events: auto; left: max(10px, env(safe-area-inset-left));
    bottom: max(10px, env(safe-area-inset-bottom)); display: grid; gap: 4px; justify-items: center;
    background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 10px; padding: 8px;
    font-variant-numeric: tabular-nums; font-size: 12px;
  }
  #dial[hidden] { display: none; }
  #dial .btn { position: static; width: 36px; height: 36px; font-size: 14px; border-radius: 8px; }
  #dial .pad { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); gap: 3px; }
  #dial .pad .mid { display: flex; align-items: center; justify-content: center; font-size: 10px; opacity: 0.6; }
  #dial .lr { display: flex; gap: 6px; align-items: center; }
  #dial .val { font-family: var(--num); min-width: 7.5em; text-align: center; }
  #dial .val b { color: var(--accent); }
  #dial .cap { opacity: 0.7; font-size: 11px; }
  #dial #lrf { width: 52px; height: 30px; border-radius: 8px; font-size: 12px; }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; background: rgba(20,22,18,0.82); font-size: 16px; z-index: 5;
    pointer-events: auto;
  }
  #rotate small { opacity: 0.7; }
  @media (orientation: portrait) and (max-width: 820px) { #rotate.show { display: flex; } }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- 基本設定（1単位 = 1m） ----------
const RANGE_LEN = 3600;
const LANE_HALF = 30;
const EYE_H = 1.65;
const BASE_FOV = 70;

const M110 = {
  muzzleVelocity: 783,   // m/s（M118LR 175gr）
  barrel: 0.508,
  magSize: 20,
  reserve: 80,
  zoomMin: 3.5, zoomMax: 10,
};

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xb9c8d4);
scene.fog = new THREE.Fog(FOG_COLOR, 1500, 9500);

const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.3, 12000);
camera.rotation.order = 'YXZ';
camera.position.set(0, EYE_H, 2);

// ---------- 光 ----------
scene.add(new THREE.HemisphereLight(0xcfe3f5, 0x5a6b3a, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(-300, 500, 200);
scene.add(sun);
const muzzleLightW = new THREE.PointLight(0xffa24a, 0, 14, 2);   // 発射炎が周囲を照らす光（常に置いて明るさだけ変える）
scene.add(muzzleLightW);

// ---------- 空 ----------
{
  const geo = new THREE.SphereGeometry(10000, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x3d72b0) }, horizon: { value: FOG_COLOR } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 horizon; varying vec3 vP;
      void main(){ float t = clamp(vP.y*2.2, 0.0, 1.0); gl_FragColor = vec4(mix(horizon, top, pow(t,0.7)), 1.0); }`
  });
  const sky = new THREE.Mesh(geo, mat); sky.renderOrder = -1; sky.frustumCulled = false;
  scene.add(sky);
}

// ---------- 地形 ----------
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z) { let s = 0, a = 1, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, z * f); a *= 0.5; f *= 2; } return s / 1.875; }
function heightAt(x, z) {
  const side = Math.max(0, Math.abs(x) - LANE_HALF);
  const sideRise = Math.min(1, side / 250);
  let h = (fbm(x / 180, z / 180) - 0.5) * 6;
  h += sideRise * sideRise * 70 * fbm(x / 400 + 7, z / 400 + 3);
  const laneFlat = 1 - Math.min(1, side / 40);
  h *= 1 - laneFlat * 0.92;
  if (z < -RANGE_LEN - 60) h += Math.min(1, (-RANGE_LEN - 60 - z) / 120) * 25;
  const far = -RANGE_LEN - 500;
  if (z < far) h += (far - z) * 0.35 * fbm(x / 300, z / 300);   // 遠景の山
  return h;
}
const hitables = [];
const rangeProps = [];   // 射撃場だけに置く物（猟場では隠す）
{
  const size = 8400, seg = 270;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, -size / 2 + 1000);
  const pos = geo.attributes.position, col = [];
  const cGrass = new THREE.Color(0x6f8a3f), cDry = new THREE.Color(0xa49a5c), cLane = new THREE.Color(0x86a14c), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, heightAt(x, z));
    const n = fbm(x / 60, z / 60);
    c.copy(cGrass).lerp(cDry, Math.max(0, n - 0.45) * 1.6);
    if (Math.abs(x) < LANE_HALF && z < 10 && z > -RANGE_LEN - 40) c.lerp(cLane, 0.6);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  ground.name = 'ground'; ground.userData = { kind: '地面', mat: 'dirt' };
  scene.add(ground);
  hitables.push(ground);
}

// ---------- 木 ----------
{
  const COUNT = 2000;
  const leaf = new THREE.InstancedMesh(new THREE.ConeGeometry(2.4, 9, 7), new THREE.MeshLambertMaterial({ color: 0x3e5a2c }), COUNT);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 2.5, 5), new THREE.MeshLambertMaterial({ color: 0x5b4632 }), COUNT);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  let n = 0, seed = 1;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  while (n < COUNT) {
    const x = (rnd() - 0.5) * 1600, z = 60 - rnd() * (RANGE_LEN + 300);
    if (Math.abs(x) < LANE_HALF + 25) continue;
    if (fbm(x / 90, z / 90) < 0.45) continue;
    const k = 0.7 + rnd() * 0.8, y = heightAt(x, z);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6.28);
    m.compose(p.set(x, y + 2.5 + 4.5 * k, z), q, s.set(k, k, k)); leaf.setMatrixAt(n, m);
    m.compose(p.set(x, y + 1.25 * k, z), q, s.set(k, k, k)); trunk.setMatrixAt(n, m);
    n++;
  }
  scene.add(leaf, trunk);
}

// ---------- 射撃位置 ----------
{
  const concrete = new THREE.MeshLambertMaterial({ color: 0xb8b4aa });
  const wood = new THREE.MeshLambertMaterial({ color: 0x8a6a48 });
  const metal = new THREE.MeshLambertMaterial({ color: 0x8a8f93, emissive: 0x3a3d40 });
  const pad = new THREE.Mesh(new THREE.BoxGeometry(24, 0.2, 8), concrete); pad.position.set(0, 0.1, 3); scene.add(pad);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(24, 0.15, 7), metal); roof.position.set(0, 3.2, 4); roof.rotation.x = -0.08; scene.add(roof);
  for (const x of [-11.5, 11.5]) for (const z of [0.8, 7]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 3.2, 0.18), metal); post.position.set(x, 1.6, z); scene.add(post);
  }
  for (const x of [-6, 0, 6]) {
    const top = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 1.0), wood); top.position.set(x, 0.9, 0.4); scene.add(top);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.12), wood); leg.position.set(x, 0.5, 0.4); scene.add(leg);
  }
  const line = new THREE.Mesh(new THREE.PlaneGeometry(24, 0.12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.rotation.x = -Math.PI / 2; line.position.set(0, 0.21, -0.95); scene.add(line);
}

// ---------- 距離看板 ----------
function makeLabel(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#f2efe6'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = '#1d1f1b'; g.lineWidth = 10; g.strokeRect(5, 5, 246, 118);
  g.fillStyle = '#1d1f1b'; g.font = 'bold 72px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 128, 68);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
{
  const post = new THREE.MeshLambertMaterial({ color: 0x4a4036 });
  const marks = []; for (let d = 100; d <= 1000; d += 100) marks.push(d); for (let d = 1500; d <= 3500; d += 500) marks.push(d);
  for (const d of marks) {
    const w = Math.min(14, 2.4 + d / 120), h = w / 2;
    for (const x of [-LANE_HALF - 2, LANE_HALF + 2]) {
      const y = heightAt(x, -d);
      const board = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: makeLabel(d + 'm'), fog: true }));
      board.position.set(x, y + 1.2 + h / 2, -d);
      board.lookAt(0, y + 1.2 + h / 2, 0);
      board.userData.kind = d + 'm看板'; board.userData.mat = 'wood';
      scene.add(board); hitables.push(board); rangeProps.push(board);
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2 + h / 2, 0.15), post);
      p.position.set(x, y + (1.2 + h / 2) / 2, -d + 0.1); scene.add(p); rangeProps.push(p);
    }
    const stake = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.4), new THREE.MeshLambertMaterial({ color: 0xd9d4c4 }));
    stake.position.set(0, heightAt(0, -d) + 0.3, -d); stake.userData.kind = d + 'm杭'; stake.userData.mat = 'concrete';
    scene.add(stake); hitables.push(stake); rangeProps.push(stake);
  }
}

// ---------- 鉄板の的（白く塗った鋼板。当たると揺れる） ----------
const plates = [];
{
  const wood = new THREE.MeshLambertMaterial({ color: 0x6b5238 });
  const chainM = new THREE.MeshLambertMaterial({ color: 0x55585a });
  const list = [
    [200, 0.3, 0.3, true], [300, 0.45, 0.45, true], [500, 0.6, 0.6, true], [800, 0.8, 1.0, false], [1000, 1.0, 1.2, false],
    [1500, 1.2, 1.6, false], [2000, 1.5, 2.0, false], [2475, 1.5, 2.0, false, '記録 2475m'], [3000, 2.0, 2.5, false], [3540, 2.0, 2.5, false, '記録 3540m'],
  ];
  for (const [d, w, h, round, rec] of list) {
    const x = 6, gy = heightAt(x, -d), top = gy + h + 1.0;
    const fw = w + 0.8;
    for (const sx of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, top + 0.1 - gy, 0.1), wood); p.position.set(x + sx * fw / 2, (top + 0.1 + gy) / 2, -d); scene.add(p); rangeProps.push(p); }
    const bar = new THREE.Mesh(new THREE.BoxGeometry(fw + 0.1, 0.1, 0.1), wood); bar.position.set(x, top + 0.1, -d); scene.add(bar); rangeProps.push(bar);
    const pivot = new THREE.Group(); pivot.position.set(x, top, -d); scene.add(pivot); rangeProps.push(pivot);
    for (const sx of [-1, 1]) { const c = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.25, 0.02), chainM); c.position.set(sx * w * 0.35, -0.125, 0); pivot.add(c); }
    const paint = new THREE.MeshStandardMaterial({ color: 0xe9e7e0, roughness: 0.7, metalness: 0.1 });
    const geo = round ? new THREE.CylinderGeometry(w / 2, w / 2, 0.012, 40).rotateX(Math.PI / 2) : new THREE.BoxGeometry(w, h, 0.012);
    const plate = new THREE.Mesh(geo, paint); plate.position.set(0, -0.25 - h / 2, 0); pivot.add(plate);
    plate.userData = { kind: (rec || d + 'm') + '鉄板', mat: 'steel', pivot };
    pivot.userData = { a: 0, v: 0 };
    hitables.push(plate); plates.push(pivot);
    if (rec) {
      const lb = new THREE.Mesh(new THREE.PlaneGeometry(8, 3), new THREE.MeshBasicMaterial({ map: makeLabel(rec.replace('記録 ', '')), fog: true }));
      lb.position.set(x + fw / 2 + 6, gy + 3, -d); lb.lookAt(0, gy + 3, 0); scene.add(lb); rangeProps.push(lb);
    }
  }
}

// =====================================================================
//  ヒグマ（体長約2m・肩の高さ約1m。肩の盛り上がりが特徴）

const furTex = (() => {

  const ang = (Math.random() - 0.5) * 0.7;
  const x = Math.sin(ang) * dist, z = -Math.cos(ang) * dist;
  parts.g.position.set(x, heightAt(x, z), z);

}
function removeBear(b) {
  scene.remove(b.g);

function setHunt(on) {

}
function startle(b, delay) {
  if (b.state === 'dead' || b.state === 'dying') return;
  if (b.alertAt < 0 || simNow + delay < b.alertAt) b.alertAt = simNow + delay;
}
function bearHit(b, zone) {
  if (b.state === 'dead' || b.state === 'dying') return;
  if (zone === 'head') { b.state = 'dying'; b.fall = 0; }
  else if (zone === 'vital') { b.dieAt = simNow + 1.2 + Math.random() * 1.5; b.state = 'flee'; b.speed = 9; aimAway(b); }   // 急所でも少し走ってから倒れる

}
function aimAway(b) {
  const p = b.g.position; b.heading = Math.atan2(p.x - camera.position.x, p.z - camera.position.z) + (Math.random() - 0.5) * 0.9;
  b.fleeD = Math.hypot(p.x - camera.position.x, p.z - camera.position.z); b.fleeT = 0;
}
function updateBears(dt) {
  for (let i = bears.length - 1; i >= 0; i--) {
    const b = bears[i], p = b.g.position;
    if (b.alertAt >= 0 && simNow >= b.alertAt && (b.state === 'graze' || b.state === 'walk')) { b.state = 'flee'; aimAway(b); b.alertAt = -1; }
    if (b.dieAt >= 0 && simNow >= b.dieAt && b.state === 'flee') { b.state = 'dying'; b.fall = 0; b.dieAt = -1; }
    let targetSpeed = 0, lean = 0;
    if (b.state === 'graze') {
      b.t -= dt; if (b.t <= 0) { b.state = 'walk'; b.t = 4 + Math.random() * 8; b.heading += (Math.random() - 0.5) * 2.2; }
    } else if (b.state === 'walk') {
      targetSpeed = 1.3; b.t -= dt;
      b.heading += Math.sin(simNow * 0.3 + i) * 0.15 * dt;
      if (b.t <= 0) { b.state = 'graze'; b.t = 3 + Math.random() * 6; }
    } else if (b.state === 'flee') {
      targetSpeed = b.wounded ? 7 : 11; lean = 0.08;
      const d = Math.hypot(p.x - camera.position.x, p.z - camera.position.z);
      b.fleeT += dt;
      if (d > b.fleeD + 450 || b.fleeT > 40) { HUNT.fled++; removeBear(b); spawnBear(); continue; }   // 林の向こうへ消えた
    } else if (b.state === 'dying') {
      b.fall = Math.min(1, b.fall + dt / 0.9);

    }
    b.speed += (targetSpeed - b.speed) * Math.min(1, dt * 2.5);

    p.y = heightAt(p.x, p.z);
    const dy = b.heading - b.g.rotation.y; b.g.rotation.y += Math.atan2(Math.sin(dy), Math.cos(dy)) * Math.min(1, dt * 3);

    const moving = b.state !== 'dying' && b.state !== 'dead';

  c.fillRect(cx - thick / 2, cy + post, thick, r - post); c.fillRect(cx - thick / 2, cy - r, thick, r - post);
  const dotR = Math.max(1.6, pxPerMil * 0.11);

  camera.position.z += (-right * sin - fwd * cos) * WALK * dt;

    if (!sh.m.visible) continue;

  if (!frozen) updateBullets(dt);

  // 煙
  const near = inScope ? 0.03 : 1;
  for (const s of smoke) {
    if (!s.sp.visible || frozen) continue;
    s.t += dt; const k = s.t / s.life;
    if (k >= 1) { s.sp.visible = false; continue; }
    const drag = Math.exp(-3.2 * dt);
    s.v.multiplyScalar(drag);
    s.v.x += (wind.vec[0] - s.v.x) * 0.9 * dt; s.v.z += (wind.vec[2] - s.v.z) * 0.9 * dt; s.v.y += 0.25 * dt;
    s.p.addScaledVector(s.v, dt);
    s.sp.position.copy(s.p);
    const sz = s.s0 + (s.s1 - s.s0) * (1 - Math.pow(1 - k, 2.2));
    s.sp.scale.setScalar(sz);
    s.sp.material.rotation += s.rot * dt;
    const d = s.p.distanceTo(camera.position);
    s.sp.material.opacity = s.a * Math.min(1, s.t / 0.04) * Math.pow(1 - k, 1.6) * (d < 6 ? near : 1);
  }
  // 火花・破片
  const wpp = 2 * Math.tan(camera.fov * Math.PI / 360) / innerHeight;
  if (!frozen) { updatePool(sparkPool, dt, wpp); updatePool(chipPool, dt, wpp); }
  // 鉄板の揺れ
  for (const pv of plates) {
    const u2 = pv.userData; if (Math.abs(u2.a) < 1e-5 && Math.abs(u2.v) < 1e-5) continue;
    u2.v += (-18 * u2.a - 1.2 * u2.v) * dt; u2.a += u2.v * dt; pv.rotation.x = u2.a;
  }
  // 飛行中の表示（遠距離は着弾まで数秒かかる）
  if (bullets.length && !frozen) {
    const b = bullets[0];
    if (b.t > 0.6) { shotEl.hidden = false; shotEl.innerHTML = `飛行中 <b>${b.t.toFixed(1)} 秒</b>・${Math.hypot(b.v[0], b.v[1], b.v[2]).toFixed(0)} m/s<div class="row">${(-b.p[2] + b.o.z).toFixed(0)} m 地点</div>`; }
  }
  // 着弾の土煙（旧）
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt;
    const k = p.t / 1.6;
    p.sp.material.opacity = Math.max(0, 0.9 * (1 - k));
    const sc = 1.2 + k * 3.5;
    p.sp.scale.setScalar(sc);
    p.sp.position.y = p.y0 + sc * 0.4 + k * 0.6;
    if (k >= 1) { scene.remove(p.sp); p.sp.material.dispose(); puffs.splice(i, 1); }
  }

  if (!frozen) updateBears(dt);
  if (huntMode) {
    // 観測手：一番近い生きているヒグマの方向と距離
    let best = null, bd = 1e9;
    for (const bb of bears) { if (bb.state === 'dead' || bb.state === 'dying') continue; const d = bb.g.position.distanceTo(camera.position); if (d < bd) { bd = d; best = bb; } }
    let txt = `仕留め <b>${HUNT.kills}</b>・手負い ${HUNT.wounded}・逃走 ${HUNT.fled}`;
    if (best) {
      const bp = best.g.position, br = Math.atan2(-(bp.x - camera.position.x), -(bp.z - camera.position.z));
      let rel = br - (yaw + S.ry); rel = Math.atan2(Math.sin(rel), Math.cos(rel));
      const deg = Math.round(rel * 180 / Math.PI), st = best.state === 'flee' ? '逃走中' : best.state === 'walk' ? '歩行中' : '採食中';
      txt += `<br>観測手：${Math.abs(deg) <= 1 ? '正面' : (deg > 0 ? '左 ' : '右 ') + Math.abs(deg) + '°'}・約${Math.round(bd / 10) * 10} m（${st}）`;
    }
    posEl.innerHTML = txt;
  } else posEl.textContent = `横 ${camera.position.x.toFixed(1)} m ／ 視線 ${((-yaw * 180 / Math.PI) % 360).toFixed(0)}°`;

  // 描画
  camera.updateMatrixWorld();
  renderer.setRenderTarget(sceneRT); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(copyScene, orthoCam);
  if (trails.length) {
    traceUniforms.uTime.value = t0;
    const pxW = 2 * Math.tan(camera.fov * Math.PI / 360) / innerHeight * 9;   // 太さ約18px
    for (let i = trails.length - 1; i >= 0; i--) {
      if (!updateTrail(trails[i], simNow, pxW)) { traceScene.remove(trails[i].mesh); trails[i].mesh.geometry.dispose(); trails.splice(i, 1); }
    }
    renderer.render(traceScene, camera);
  }
  if (gun.visible) { renderer.clearDepth(); renderer.render(gunScene, gunCam); }
  requestAnimationFrame(tick);
}
updateAmmo(); drawScope(); tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  gunCam.aspect = innerWidth / innerHeight; gunCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); sizeTargets(); drawScope();
});

// テスト用の入口
window.__game = { bears, setHunt, HUNT, fire, toggleAim, setZoom, reload, S, gun, HIP, camera, puffs, dial, setAmmo, rangefind, plates, decals, get ammo() { return ammo; }, bullets, trails, smoke, wind, ZERO_ANGLE, get yaw() { return yaw; }, set yaw(v) { yaw = v; }, get pitch() { return pitch; }, set pitch(v) { pitch = v; } };
</script>
