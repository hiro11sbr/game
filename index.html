<title>Long Range 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 全画面の3D射撃場。暗い半透明の計器パネルを画面の角に置く単一テーマ */
  :root {
    color-scheme: dark;
    --hud-fg: #eef0e8;
    --hud-bg: rgba(20, 22, 18, 0.55);
    --hud-line: rgba(244, 241, 234, 0.35);
    --accent: #e8b04a;
    --btn-bg: rgba(20, 22, 18, 0.5);
    --btn-on: rgba(232, 176, 74, 0.85);
    --num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
    -webkit-touch-callout: none; color: var(--hud-fg);
  }
  canvas { display: block; }
  #scope { position: fixed; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); pointer-events: none; will-change: transform; }
  #scope[hidden] { display: none; }
  #flash {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse 60% 45% at 50% 78%, rgba(255,190,110,0.85), rgba(255,140,60,0.35) 45%, rgba(0,0,0,0) 75%);
    mix-blend-mode: screen;
  }
  #flash.red { background: radial-gradient(ellipse 70% 55% at 50% 60%, rgba(255,60,40,0.85), rgba(255,20,10,0.35) 45%, rgba(0,0,0,0) 78%); }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel {
    position: absolute; background: var(--hud-bg); border: 1px solid var(--hud-line);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.5;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #leftcol { position: absolute; top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #leftcol .panel { position: static; }
  #info b { color: var(--accent); font-weight: 600; }
  #modeBtn {
    pointer-events: auto; font: inherit; font-size: 12px; color: var(--hud-fg); background: transparent;
    border: 1px solid var(--hud-line); border-radius: 6px; padding: 2px 8px;
  }
  #pos b { color: var(--accent); }
  #shot {
    position: absolute; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    white-space: nowrap; text-align: center; font-size: 12px; line-height: 1.45; letter-spacing: 0.02em;
    text-shadow: 0 1px 2px #000, 0 0 8px rgba(0,0,0,0.8); transition: opacity 0.6s; pointer-events: none;
  }
  #shot.fade { opacity: 0; }
  #lrfHud {
    position: absolute; left: 50%; top: 50%; transform: translate(calc(min(47vh, 47vw) * 0.38), calc(-100% - min(47vh, 47vw) * 0.52));
    font-family: var(--num); font-size: 13px; font-weight: 600; color: #ff5a3a; letter-spacing: 0.04em;
    text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 1px 2px #000; pointer-events: none;
  }
  #lrfHud[hidden] { display: none; }
  #gear {
    width: 40px; height: 40px; font-size: 20px; border-radius: 10px;
    top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right));
  }
  #wpn {
    position: absolute; right: max(6px, env(safe-area-inset-right)); bottom: max(6px, env(safe-area-inset-bottom));
    text-align: right; font-size: 12px; line-height: 1.35; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,0.6); font-variant-numeric: tabular-nums;
  }
  #wpn #ammoName { color: var(--accent); font-weight: 600; }
  #settings { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); z-index: 4; }
  #settings[hidden] { display: none; }
  #settings .sheet {
    background: rgba(20,22,18,0.92); border: 1px solid var(--hud-line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px;
    width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 24px); overflow: auto; font-size: 13px;
  }
  #settings .sh-head { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  #settings .sh-head b { color: var(--accent); }
  #setClose { font-size: 22px; width: 40px; height: 36px; border-radius: 8px; background: transparent; color: var(--hud-fg); border: 1px solid var(--hud-line); }
  #settings .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #settings .cats[hidden] { display: none; }
  #settings .cat, #settings .card {
    font: inherit; color: var(--hud-fg); background: rgba(255,255,255,0.05); border: 1px solid var(--hud-line); border-radius: 10px;
    padding: 8px; display: grid; gap: 4px; justify-items: start; text-align: left; min-width: 0;
  }
  #settings .cat .ct { font-size: 11px; opacity: 0.7; }
  #settings .cat .cn, #settings .card .cn { font-weight: 600; }
  #settings img { width: 100%; aspect-ratio: 2 / 1; object-fit: cover; border-radius: 6px; background: #2a2d30; display: block; }
  #settings .card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #settings .card .cd { font-size: 11px; opacity: 0.7; }
  #settings .pk-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  #settings .pk-head b { color: var(--accent); }
  #pickBack { font: inherit; color: var(--hud-fg); background: transparent; border: 1px solid var(--hud-line); border-radius: 8px; padding: 5px 10px; }
  #settings .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  #settings .list { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
  #settings .opts { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; }
  #settings .opts button { font: inherit; color: var(--hud-fg); background: rgba(255,255,255,0.06); border: 1px solid var(--hud-line); border-radius: 8px; padding: 7px 10px; }
  #settings .opts button.on { background: var(--btn-on); color: #1d1f1b; border-color: transparent; font-weight: 600; }
  #settings .note { font-size: 11px; opacity: 0.7; }
  #ammo { font-family: var(--num); font-size: 13px; font-weight: 600; }
  #ammo small { font-size: 12px; opacity: 0.7; }
  #mag { font-family: var(--num); }
  #wind { margin-top: 2px; font-variant-numeric: tabular-nums; }
  #windArrow { display: inline-block; color: var(--accent); font-weight: 700; transition: transform 0.4s; }
  #shot { font-variant-numeric: tabular-nums; }
  #shot b { color: var(--accent); }
  #shot .row { font-family: var(--num); font-size: 11px; opacity: 0.85; }
  #cross {
    position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
    border-radius: 50%; background: var(--hud-fg); box-shadow: 0 0 2px #000;
  }
  #stick-base {
    position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid var(--hud-line); background: rgba(20,22,18,0.25); display: none;
  }
  #stick-knob {
    position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(244,241,234,0.55); display: none;
  }
  #help {
    bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    white-space: nowrap; opacity: 0.85;
  }
  .btn {
    position: absolute; pointer-events: auto; border-radius: 50%;
    background: var(--btn-bg); border: 2px solid var(--hud-line); color: var(--hud-fg);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; line-height: 1.1;
    font-family: inherit; text-align: center; padding: 0; -webkit-tap-highlight-color: transparent;
  }
  .btn:active, .btn.on { background: var(--btn-on); color: #1d1f1b; }
  #fire {
    width: 84px; height: 84px; font-size: 15px;
    right: max(6px, env(safe-area-inset-right)); bottom: calc(max(6px, env(safe-area-inset-bottom)) + 68px);
    border-color: rgba(232, 176, 74, 0.8);
  }
  #ads { width: 60px; height: 60px; right: calc(max(6px, env(safe-area-inset-right)) + 94px); bottom: calc(max(6px, env(safe-area-inset-bottom)) + 76px); }
  #reload { width: 50px; height: 50px; font-size: 11px; right: calc(max(6px, env(safe-area-inset-right)) + 164px); bottom: calc(max(6px, env(safe-area-inset-bottom)) + 81px); }
  #zoom {
    position: absolute; pointer-events: auto; display: flex; align-items: center; gap: 8px;
    right: max(6px, env(safe-area-inset-right)); bottom: calc(max(6px, env(safe-area-inset-bottom)) + 44px);
  }
  #zoom[hidden] { display: none; }
  #ztrack {
    position: relative; width: 170px; height: 16px; border-radius: 8px; touch-action: none;
    background: var(--hud-bg); border: 1px solid var(--hud-line); overflow: hidden;
  }
  #zfill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(232, 176, 74, 0.28); }
  #zthumb {
    position: absolute; top: 2px; bottom: 2px; width: 10px; margin-left: -5px; border-radius: 5px;
    background: var(--accent); box-shadow: 0 0 0 2px rgba(20,22,18,0.6);
  }
  #ztrack .tick { position: absolute; top: 4px; bottom: 4px; width: 1px; background: var(--hud-line); }
  #zoom .cap { font-size: 11px; opacity: 0.7; }
  #zoomv { font-family: var(--num); font-size: 12px; text-shadow: 0 1px 2px #000; }
  #ammoBtn {
    pointer-events: auto; font: inherit; font-family: var(--num); font-size: 12px; color: var(--hud-fg);
    background: transparent; border: 1px solid var(--hud-line); border-radius: 6px; padding: 2px 6px; margin-top: 2px;
  }
  #ammoBtn b { color: var(--accent); font-weight: 600; }
  #dial {
    position: absolute; pointer-events: auto; left: max(6px, env(safe-area-inset-left));
    bottom: max(6px, env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: flex-end;
    font-variant-numeric: tabular-nums; font-size: 12px; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,0.7);
  }
  #dial[hidden] { display: none; }
  #dial .dcol { display: grid; gap: 4px; justify-items: center; }
  #dial .btn { position: static; width: 34px; height: 34px; font-size: 13px; border-radius: 9px; background: rgba(20,22,18,0.45); }
  #dial .pad { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 0; }
  #dial .pad .mid { display: flex; align-items: center; justify-content: center; font-size: 8px; opacity: 0.6; }
  #dial .lr { display: flex; gap: 6px; align-items: center; }
  #dial .val { font-family: var(--num); min-width: 7.5em; text-align: center; }
  #dial .val b { color: var(--accent); }
  #dial .cap { opacity: 0.7; font-size: 11px; }
  #dial #lrf { width: 46px; height: 28px; border-radius: 8px; font-size: 12px; }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; background: rgba(20,22,18,0.82); font-size: 16px; z-index: 5;
    pointer-events: auto;
  }
  #rotate small { opacity: 0.7; }
  @media (orientation: portrait) and (max-width: 820px) { #rotate.show { display: flex; } }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- 基本設定（1単位 = 1m） ----------
const RANGE_LEN = 3600;
const LANE_HALF = 30;
const EYE_H = 1.65;
const BASE_FOV = 70;

const M110 = {
  muzzleVelocity: 783,   // m/s（M118LR 175gr）
  barrel: 0.508,
  magSize: 20,
  reserve: 80,
  zoomMin: 3.5, zoomMax: 10,
};

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);
renderer.domElement.style.cssText += ';position:fixed;left:0;top:0;';

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xb9c8d4);
scene.fog = new THREE.Fog(FOG_COLOR, 1500, 9500);

const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.3, 12000);
camera.rotation.order = 'YXZ';
camera.position.set(0, EYE_H, 2);

// ---------- 光 ----------
const hemi = new THREE.HemisphereLight(0xcfe3f5, 0x5a6b3a, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(-300, 500, 200);
scene.add(sun);
const muzzleLightW = new THREE.PointLight(0xffa24a, 0, 14, 2);   // 発射炎が周囲を照らす光（常に置いて明るさだけ変える）
scene.add(muzzleLightW);

let skyMat = null;
// ---------- 空 ----------
{
  const geo = new THREE.SphereGeometry(10000, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x3d72b0) }, horizon: { value: FOG_COLOR } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 horizon; varying vec3 vP;
      void main(){ float t = clamp(vP.y*2.2, 0.0, 1.0); gl_FragColor = vec4(mix(horizon, top, pow(t,0.7)), 1.0); }`
  });
  const sky = new THREE.Mesh(geo, mat); sky.renderOrder = -1; sky.frustumCulled = false; sky.userData.keep = true; skyMat = mat;
  scene.add(sky);
}

// ---------- 地形 ----------
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z) { let s = 0, a = 1, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, z * f); a *= 0.5; f *= 2; } return s / 1.875; }
let stage = 'range';
function heightAt(x, z) { return stage === 'city' ? cityHeightAt(x, z) : rangeHeightAt(x, z); }
function rangeHeightAt(x, z) {
  const side = Math.max(0, Math.abs(x) - LANE_HALF);
  const sideRise = Math.min(1, side / 250);
  let h = (fbm(x / 180, z / 180) - 0.5) * 6;
  h += sideRise * sideRise * 70 * fbm(x / 400 + 7, z / 400 + 3);
  const laneFlat = 1 - Math.min(1, side / 40);
  h *= 1 - laneFlat * 0.92;
  if (z < -RANGE_LEN - 60) h += Math.min(1, (-RANGE_LEN - 60 - z) / 120) * 25;
  const far = -RANGE_LEN - 500;
  if (z < far) h += (far - z) * 0.35 * fbm(x / 300, z / 300);   // 遠景の山
  return h;
}
const hitables = [];
let rangeGround = null, cityGround = null, activeGround = null;
const rangeProps = [];   // 射撃場だけに置く物（猟場では隠す）
{
  const size = 8400, seg = 270;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, -size / 2 + 1000);
  const pos = geo.attributes.position, col = [];
  const cGrass = new THREE.Color(0x6f8a3f), cDry = new THREE.Color(0xa49a5c), cLane = new THREE.Color(0x86a14c), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, heightAt(x, z));
    const n = fbm(x / 60, z / 60);
    c.copy(cGrass).lerp(cDry, Math.max(0, n - 0.45) * 1.6);
    if (Math.abs(x) < LANE_HALF && z < 10 && z > -RANGE_LEN - 40) c.lerp(cLane, 0.6);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  ground.name = 'ground'; ground.userData = { kind: '地面', mat: 'dirt' }; rangeGround = ground;
  scene.add(ground);
  hitables.push(ground);
}

// ---------- 木 ----------
{
  const COUNT = 2000;
  const leaf = new THREE.InstancedMesh(new THREE.ConeGeometry(2.4, 9, 7), new THREE.MeshLambertMaterial({ color: 0x3e5a2c }), COUNT);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 2.5, 5), new THREE.MeshLambertMaterial({ color: 0x5b4632 }), COUNT);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  let n = 0, seed = 1;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  while (n < COUNT) {
    const x = (rnd() - 0.5) * 1600, z = 60 - rnd() * (RANGE_LEN + 300);
    if (Math.abs(x) < LANE_HALF + 25) continue;
    if (fbm(x / 90, z / 90) < 0.45) continue;
    const k = 0.7 + rnd() * 0.8, y = heightAt(x, z);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6.28);
    m.compose(p.set(x, y + 2.5 + 4.5 * k, z), q, s.set(k, k, k)); leaf.setMatrixAt(n, m);
    m.compose(p.set(x, y + 1.25 * k, z), q, s.set(k, k, k)); trunk.setMatrixAt(n, m);
    n++;
  }
  scene.add(leaf, trunk);
}

// ---------- 射撃位置 ----------
{

// 発射炎（消炎器から割れる炎＋中心の光）。brake=true は横へ吹き出す大型の制退器
function addMuzzleFx(g, muzzleZ, sc, brake) {
  const fl = makeFlashTex();
  const flash = new THREE.Group(); flash.position.set(0, BORE_Y, muzzleZ); g.add(flash);
  const flashMat = new THREE.MeshBasicMaterial({ map: fl.side, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false, opacity: 0 });
  for (let i = 0; i < 3; i++) {
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(0.11 * sc, 0.2 * sc), flashMat);
    pl.rotation.set(-Math.PI / 2, 0, 0); pl.rotateY(i * Math.PI / 3); pl.position.z = -0.095 * sc; flash.add(pl);
  }
  if (brake) for (const sx of [-1, 1]) for (const zz of [0.05, 0.11]) {   // 制退器の横穴から真横へ噴く炎
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(0.16 * sc, 0.34 * sc), flashMat);
    pl.rotation.set(0, 0, -sx * Math.PI / 2); pl.position.set(sx * 0.17 * sc, 0, zz); flash.add(pl);
  }
  const starMat = new THREE.MeshBasicMaterial({ map: fl.star, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false, opacity: 0 });
  const star = new THREE.Mesh(new THREE.PlaneGeometry(0.16 * sc, 0.16 * sc), starMat); star.position.z = -0.03; flash.add(star);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: fl.glow, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, opacity: 0 }));
  glow.scale.setScalar(0.22 * sc); glow.position.z = -0.04; flash.add(glow);
  const gunLight = new THREE.PointLight(0xffa04a, 0, 2.5 * sc, 2); gunLight.position.set(0, BORE_Y + 0.02, muzzleZ + 0.05); g.add(gunLight);
  return { flash, flashMat, starMat, star, glow, gunLight, glowBase: 0.18 * sc };
}

  rbox(0.036, 0.024, 0.5, 0.008, wood, 0, 0.043, -0.37);                          // 上の木製カバー
  for (const z of [-0.3, -0.6]) { const bd = cylZ(0.028, 0.028, 0.022, steel, 0, 0.015, z, 18); bd.scale.set(0.95, 1, 1.25); }   // 銃身の帯
  rbox(0.05, 0.02, 0.02, 0.004, steel, 0, -0.13, 0.53);                            // 床尾板
  // 機関部・ボルト・弾倉の底板・用心金
  cylZ(0.017, 0.017, 0.22, steel, 0, BORE_Y + 0.004, -0.03, 20);
  rbox(0.036, 0.012, 0.1, 0.003, steel, 0, -0.058, 0.02);
  rbox(0.012, 0.005, 0.07, 0.002, steel, 0, -0.07, 0.08);
  add(new THREE.TorusGeometry(0.012, 0.002, 6, 12, Math.PI * 0.55), steel, 0, -0.055, 0.085, 0, Math.PI / 2, Math.PI * 1.15);
  const bolt = new THREE.Group(); bolt.position.set(0.012, BORE_Y + 0.004, 0.06); g.add(bolt);
  add(new THREE.CylinderGeometry(0.005, 0.005, 0.07, 10), steel, 0.03, -0.022, 0, 0, 0, Math.PI / 2 + 0.75, bolt);     // 下へ曲げた柄
  add(new THREE.SphereGeometry(0.011, 12, 8), steel, 0.055, -0.048, 0.002, 0, 0, 0, bolt);
  cylZ(0.012, 0.012, 0.05, steel, 0, BORE_Y + 0.004, 0.105, 14);                    // ボルト後端
  // 銃身・照星・洗い矢
  cylZ(0.0115, 0.0105, 0.75, steel, 0, BORE_Y, -0.49, 18);
  cylZ(0.014, 0.014, 0.03, steel, 0, BORE_Y + 0.004, -0.85, 16);
  add(new THREE.CircleGeometry(0.0055, 12), hole, 0, BORE_Y, MOSIN_MUZZLE_Z + 0.002, 0, Math.PI, 0);
  cylZ(0.003, 0.003, 0.2, steel, 0, -0.008, -0.72, 6);

  const sy = 0.092;

function makeFlashTex() {
  const mk = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
  const side = mk(64, 128, (g, w, h) => {      // 横から見た炎：根元が白く、先が橙
    for (let i = 0; i < 26; i++) {
      const x = w / 2 + (Math.random() - 0.5) * w * 0.5, len = h * (0.45 + Math.random() * 0.5);
      const gr = g.createLinearGradient(0, h, 0, h - len);
      gr.addColorStop(0, 'rgba(255,250,220,0.55)'); gr.addColorStop(0.35, 'rgba(255,190,90,0.35)'); gr.addColorStop(1, 'rgba(255,110,30,0)');
      g.fillStyle = gr; g.beginPath(); g.ellipse(x, h - len / 2, 2 + Math.random() * 5, len / 2, 0, 0, Math.PI * 2); g.fill();
    }
  });
  const star = mk(128, 128, (g, w, h) => {     // 正面から見た4方向の割れ
    g.translate(w / 2, h / 2);
    const core = g.createRadialGradient(0, 0, 0, 0, 0, 30); core.addColorStop(0, 'rgba(255,255,235,1)'); core.addColorStop(1, 'rgba(255,170,70,0)');
    g.fillStyle = core; g.beginPath(); g.arc(0, 0, 30, 0, Math.PI * 2); g.fill();
    for (let i = 0; i < 4; i++) {
      g.save(); g.rotate(i * Math.PI / 2 + Math.PI / 4);
      const gr = g.createLinearGradient(0, 0, 60, 0); gr.addColorStop(0, 'rgba(255,230,170,0.9)'); gr.addColorStop(1, 'rgba(255,120,30,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(0, -7); g.lineTo(62, 0); g.lineTo(0, 7); g.fill(); g.restore();
    }
  });
  const glow = mk(64, 64, (g, w) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,240,200,1)'); gr.addColorStop(0.3, 'rgba(255,170,80,0.55)'); gr.addColorStop(1, 'rgba(255,120,40,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  return { side, star, glow };
}

// =====================================================================
//  スコープ表示（ミルドット照準）
// =====================================================================
const scopeCv = document.getElementById('scope');
const sctx = scopeCv.getContext('2d');
const zoomEl = document.getElementById('zoomv');
const flashEl = document.getElementById('flash');
let zoom = 10;
const scopeFovDeg = () => 20 / zoom;
function scopeRadiusPx() { return Math.min(innerWidth, innerHeight) * 0.47; }
function drawScope() {
  const dpr = Math.min(devicePixelRatio, 2);
  const PAD = 40, W = innerWidth + PAD * 2, H = innerHeight + PAD * 2;
  if (scopeCv.width !== Math.round(W * dpr)) { scopeCv.width = Math.round(W * dpr); scopeCv.height = Math.round(H * dpr); }
  const c = sctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, r = scopeRadiusPx();
  // 黒く塗らず、スコープの縁だけを輪で描く（外側も同じ倍率で見える）
  const vg = c.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.06);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.6, 'rgba(0,0,0,0.55)'); vg.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = vg; c.beginPath(); c.arc(cx, cy, r * 1.06, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(10,10,10,0.85)'; c.lineWidth = 4; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();
  c.strokeStyle = 'rgba(235,232,220,0.35)'; c.lineWidth = 1; c.beginPath(); c.arc(cx, cy, r + 3, 0, Math.PI * 2); c.stroke();
  const pxPerMil = (2 * r) / (scopeFovDeg() * Math.PI / 180 * 1000);
  // ツリー型の目盛り（第1焦点面：どの倍率でもミルの値は正しい）。間隔が狭いときは細かい線を省く
  const step = pxPerMil >= 9 ? 1 : pxPerMil >= 4.5 ? 2 : 5;          // 線を引く間隔（ミル）
  const numStep = step === 1 ? 2 : step === 2 ? 4 : 10;               // 数字を付ける間隔
  c.save(); c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.clip();
  c.strokeStyle = '#0b0b0b'; c.fillStyle = '#0b0b0b'; c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(cx - r, cy); c.lineTo(cx + r, cy); c.moveTo(cx, cy - r); c.lineTo(cx, cy + 20.5 * pxPerMil); c.stroke();
  const thick = 4, postH = 10 * pxPerMil, postV = 20 * pxPerMil;
  if (postH < r) { c.fillRect(cx - r, cy - thick / 2, r - postH, thick); c.fillRect(cx + postH, cy - thick / 2, r - postH, thick); }
  if (5 * pxPerMil < r) c.fillRect(cx - thick / 2, cy - r, thick, r - 5 * pxPerMil);
  if (postV < r) c.fillRect(cx - thick / 2, cy + postV, thick, r - postV);
  const label = (txt, x, y) => { c.font = '600 10px ui-monospace, Menlo, monospace'; c.lineWidth = 3; c.strokeStyle = 'rgba(235,232,220,0.75)'; c.strokeText(txt, x, y); c.fillText(txt, x, y); c.lineWidth = 1.2; c.strokeStyle = '#0b0b0b'; };
  c.textAlign = 'center'; c.textBaseline = 'middle';
  // 左右の目盛り（±10ミル）
  for (let m = step; m <= 10; m += step) for (const sg of [-1, 1]) {
    const x = cx + sg * m * pxPerMil, big = m % numStep === 0, h = big ? 7 : 4;
    c.beginPath(); c.moveTo(x, cy - h); c.lineTo(x, cy + h); c.stroke();
    if (big) label(String(m), x, cy - 14);
  }
  // 上の目盛り（5ミルまで）
  for (let m = step; m < 5; m += step) { const y = cy - m * pxPerMil; c.beginPath(); c.moveTo(cx - 4, y); c.lineTo(cx + 4, y); c.stroke(); }
  // 下のツリー（20ミルまで）：落下を読む横線と、風を読む点
  for (let m = step; m <= 20; m += step) {
    const y = cy + m * pxPerMil, big = m % numStep === 0, h = big ? 8 : 5;
    c.beginPath(); c.moveTo(cx - h, y); c.lineTo(cx + h, y); c.stroke();
    const wMax = Math.min(10, Math.floor(m / 2));                      // 下へ行くほど横に広がる
    if (big) { c.textAlign = 'left'; label(String(m), cx + Math.max(11, (Math.floor(wMax / step) * step + 0.6) * pxPerMil + 4), y); c.textAlign = 'center'; }
    if (m % (step * 2) === 0 || step === 5) {
      for (let k = step; k <= wMax; k += step) for (const sg of [-1, 1]) { c.beginPath(); c.arc(cx + sg * k * pxPerMil, y, 1.4, 0, Math.PI * 2); c.fill(); }
    }
  }
  // 中心付近の0.2ミル刻み（拡大したときだけ）
  if (pxPerMil >= 28) for (let m = 0.2; m < 1; m += 0.2) for (const sg of [-1, 1]) {
    c.beginPath(); c.moveTo(cx + sg * m * pxPerMil, cy - 2.5); c.lineTo(cx + sg * m * pxPerMil, cy + 2.5); c.stroke();
    c.beginPath(); c.moveTo(cx - 2.5, cy + m * pxPerMil); c.lineTo(cx + 2.5, cy + m * pxPerMil); c.stroke();
  }
  c.beginPath(); c.arc(cx, cy, 1.3, 0, Math.PI * 2); c.fill();
  c.restore();
  c.textBaseline = 'alphabetic';
  c.fillStyle = 'rgba(238,240,232,0.75)'; c.font = '11px ui-monospace, Menlo, monospace'; c.textAlign = 'center';

  zoomEl.textContent = zoom.toFixed(1) + 'x';
}

  if (!frozen) { updateBears(dt); updateRings(dt); updateEnemies(dt); updateZone(dt); }
  { const ms = 0.022 * 2 * Math.tan(camera.fov * Math.PI / 360);          // 画面の高さの約2%
    for (const e of enemies) { e.marker.visible = e.state !== 'down' && e.state !== 'falling'; e.marker.scale.setScalar(ms); }

      txt += `<br>観測手：${Math.abs(deg) <= 1 ? '正面' : (deg > 0 ? '左 ' : '右 ') + Math.abs(deg) + '°'}・約${Math.round(bd / 10) * 10} m の屋上（${st}）`;

// 設定画面のイメージ画像（銃とステージ）を最初に一度だけ撮る

}
