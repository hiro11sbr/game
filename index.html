<style>
  /* 全画面の3D射撃場。暗い半透明の計器パネルを画面の角に置く単一テーマ */
  :root {
    color-scheme: dark;
    --hud-fg: #eef0e8;
    --hud-bg: rgba(20, 22, 18, 0.55);
    --hud-line: rgba(244, 241, 234, 0.35);

  #status {
    top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));

  #ammo { font-family: var(--num); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  #ammo small { font-size: 12px; opacity: 0.7; }
  #mag { font-family: var(--num); }
  #wind { margin-top: 2px; font-variant-numeric: tabular-nums; }
  #windArrow { display: inline-block; color: var(--accent); font-weight: 700; transition: transform 0.4s; }
  #shot b { color: var(--accent); }

  #shot {
    top: calc(max(10px, env(safe-area-inset-top)) + 64px); left: max(10px, env(safe-area-inset-left));

  }
  #cross {
    position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;

  }
  #stick-base {
    position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid var(--hud-line); background: rgba(20,22,18,0.25); display: none;
  }
  #stick-knob {
    position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(244,241,234,0.55); display: none;
  }
  #help {
    bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    white-space: nowrap; opacity: 0.85;
  }
  .btn {
    position: absolute; pointer-events: auto; border-radius: 50%;
    background: var(--btn-bg); border: 2px solid var(--hud-line); color: var(--hud-fg);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; line-height: 1.1;
    font-family: inherit; text-align: center; padding: 0; -webkit-tap-highlight-color: transparent;
  }
  .btn:active, .btn.on { background: var(--btn-on); color: #1d1f1b; }
  #fire {
    width: 84px; height: 84px; font-size: 15px;
    right: calc(max(16px, env(safe-area-inset-right)) + 8px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 8px);
    border-color: rgba(232, 176, 74, 0.8);
  }
  #ads { width: 60px; height: 60px; right: calc(max(16px, env(safe-area-inset-right)) + 104px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 18px); }
  #reload { width: 52px; height: 52px; font-size: 11px; right: calc(max(16px, env(safe-area-inset-right)) + 176px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 22px); }
  #zoom {
    position: absolute; pointer-events: auto; right: max(12px, env(safe-area-inset-right));
    top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px;

    flex-direction: column; gap: 12px; background: rgba(20,22,18,0.82); font-size: 16px; z-index: 5;

<script type="module">
import * as THREE from 'three';

// ---------- 基本設定（1単位 = 1m） ----------
const RANGE_LEN = 1000;          // 標的までの最大距離
const LANE_HALF = 30;            // 射撃レーンの半幅
const EYE_H = 1.65;              // 目の高さ（立ち）
const BASE_FOV = 70;

// M110 の公表値（段階③の弾道計算で使う）
const M110 = {
  muzzleVelocity: 783,   // m/s（M118LR 175gr）
  barrel: 0.508,         // m
  magSize: 20,
  reserve: 80,
  zoomMin: 3.5, zoomMax: 10,
};

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xb9c8d4);
scene.fog = new THREE.Fog(FOG_COLOR, 400, 2600);

const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.05, 6000);
camera.rotation.order = 'YXZ';
camera.position.set(0, EYE_H, 2);

// ---------- 光 ----------
scene.add(new THREE.HemisphereLight(0xcfe3f5, 0x5a6b3a, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(-300, 500, 200);
scene.add(sun);

// ---------- 空 ----------
{
  const geo = new THREE.SphereGeometry(5000, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x4f86c0) }, horizon: { value: FOG_COLOR } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 horizon; varying vec3 vP;
      void main(){ float t = clamp(vP.y*2.2, 0.0, 1.0); gl_FragColor = vec4(mix(horizon, top, pow(t,0.7)), 1.0); }`
  });
  scene.add(new THREE.Mesh(geo, mat));
}

// ---------- 地形 ----------
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z) { let s = 0, a = 1, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, z * f); a *= 0.5; f *= 2; } return s / 1.875; }
function heightAt(x, z) {
  const side = Math.max(0, Math.abs(x) - LANE_HALF);           // レーンの外ほど起伏
  const sideRise = Math.min(1, side / 250);
  let h = (fbm(x / 180, z / 180) - 0.5) * 6;                   // ゆるい起伏
  h += sideRise * sideRise * 70 * fbm(x / 400 + 7, z / 400 + 3);
  const laneFlat = 1 - Math.min(1, side / 40);
  h *= 1 - laneFlat * 0.92;
  if (z < -RANGE_LEN - 60) h += Math.min(1, (-RANGE_LEN - 60 - z) / 120) * 25; // 奥の土手
  if (z < -1800) h += (-1800 - z) * 0.35 * fbm(x / 300, z / 300);             // 遠景の山
  return h;
}
const hitables = [];   // 弾が当たる物
{
  const size = 5000, seg = 220;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, -size / 2 + 800);
  const pos = geo.attributes.position, col = [];
  const cGrass = new THREE.Color(0x6f8a3f), cDry = new THREE.Color(0xa49a5c), cLane = new THREE.Color(0x86a14c), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, heightAt(x, z));
    const n = fbm(x / 60, z / 60);
    c.copy(cGrass).lerp(cDry, Math.max(0, n - 0.45) * 1.6);
    if (Math.abs(x) < LANE_HALF && z < 10 && z > -RANGE_LEN - 40) c.lerp(cLane, 0.6);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  ground.name = 'ground';
  scene.add(ground);
  hitables.push(ground);
}

// ---------- 木（まとめて描画して軽くする） ----------
{
  const COUNT = 900;
  const leaf = new THREE.InstancedMesh(new THREE.ConeGeometry(2.4, 9, 7), new THREE.MeshLambertMaterial({ color: 0x3e5a2c }), COUNT);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 2.5, 5), new THREE.MeshLambertMaterial({ color: 0x5b4632 }), COUNT);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  let n = 0, seed = 1;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  while (n < COUNT) {
    const x = (rnd() - 0.5) * 1400, z = 60 - rnd() * 1400;
    if (Math.abs(x) < LANE_HALF + 25) continue;
    if (fbm(x / 90, z / 90) < 0.45) continue;                     // 林のかたまりを作る
    const k = 0.7 + rnd() * 0.8, y = heightAt(x, z);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6.28);
    m.compose(p.set(x, y + 2.5 + 4.5 * k, z), q, s.set(k, k, k)); leaf.setMatrixAt(n, m);
    m.compose(p.set(x, y + 1.25 * k, z), q, s.set(k, k, k)); trunk.setMatrixAt(n, m);
    n++;
  }
  scene.add(leaf, trunk);
}

// ---------- 射撃位置（コンクリートの台・屋根・射撃台） ----------
{
  const concrete = new THREE.MeshLambertMaterial({ color: 0xb8b4aa });
  const wood = new THREE.MeshLambertMaterial({ color: 0x8a6a48 });
  const metal = new THREE.MeshLambertMaterial({ color: 0x8a8f93, emissive: 0x3a3d40 });
  const pad = new THREE.Mesh(new THREE.BoxGeometry(24, 0.2, 8), concrete); pad.position.set(0, 0.1, 3); scene.add(pad);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(24, 0.15, 7), metal); roof.position.set(0, 3.2, 4); roof.rotation.x = -0.08; scene.add(roof);
  for (const x of [-11.5, 11.5]) for (const z of [0.8, 7]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 3.2, 0.18), metal); post.position.set(x, 1.6, z); scene.add(post);
  }
  for (const x of [-6, 0, 6]) {
    const top = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 1.0), wood); top.position.set(x, 0.9, 0.4); scene.add(top);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.12), wood); leg.position.set(x, 0.5, 0.4); scene.add(leg);
  }
  const line = new THREE.Mesh(new THREE.PlaneGeometry(24, 0.12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.rotation.x = -Math.PI / 2; line.position.set(0, 0.21, -0.95); scene.add(line);
}

// ---------- 距離看板（100mごと） ----------
function makeLabel(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#f2efe6'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = '#1d1f1b'; g.lineWidth = 10; g.strokeRect(5, 5, 246, 118);
  g.fillStyle = '#1d1f1b'; g.font = 'bold 72px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 128, 68);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
{
  const post = new THREE.MeshLambertMaterial({ color: 0x4a4036 });
  for (let d = 100; d <= RANGE_LEN; d += 100) {
    const w = 2.4 + d / 120, h = w / 2;
    for (const x of [-LANE_HALF - 2, LANE_HALF + 2]) {
      const y = heightAt(x, -d);
      const board = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: makeLabel(d + 'm'), fog: true }));
      board.position.set(x, y + 1.2 + h / 2, -d);
      board.lookAt(0, y + 1.2 + h / 2, 0);
      board.userData.kind = d + 'm看板';
      scene.add(board); hitables.push(board);
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2 + h / 2, 0.15), post);
      p.position.set(x, y + (1.2 + h / 2) / 2, -d + 0.1); scene.add(p);
    }
    const stake = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.4), new THREE.MeshLambertMaterial({ color: 0xd9d4c4 }));
    stake.position.set(0, heightAt(0, -d) + 0.3, -d); stake.userData.kind = d + 'm杭';
    scene.add(stake); hitables.push(stake);
  }
}

// =====================================================================
//  M110 の3Dモデル（基本図形の組み合わせ。単位m、銃口は -z 方向）
// =====================================================================
function buildM110() {
  const g = new THREE.Group();
  const black = new THREE.MeshStandardMaterial({ color: 0x5a5f63, roughness: 0.55, metalness: 0.1 });
  const poly = new THREE.MeshStandardMaterial({ color: 0x4c5053, roughness: 0.9, metalness: 0.0 });
  const steel = new THREE.MeshStandardMaterial({ color: 0x6a6f73, roughness: 0.4, metalness: 0.25 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x24384a, roughness: 0.05, metalness: 0.9, emissive: 0x0a1420 });
  const box = (w, h, d, mat, x, y, z, rx = 0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.rotation.x = rx; g.add(m); return m;
  };
  const cyl = (r1, r2, len, mat, x, y, z, seg = 16) => {     // z軸方向の円柱
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, len, seg), mat);
    m.rotation.x = Math.PI / 2; m.position.set(x, y, z); g.add(m); return m;
  };

  // 銃床（伸縮式・頬当て付き）と緩衝筒
  cyl(0.016, 0.016, 0.22, black, 0, 0.012, 0.21);
  box(0.044, 0.07, 0.17, poly, 0, 0.012, 0.31);            // 銃床の上部
  box(0.040, 0.03, 0.13, poly, 0, 0.06, 0.32);             // 頬当て
  box(0.038, 0.09, 0.12, poly, 0, -0.045, 0.335, -0.42);   // 銃床の下部（斜め）
  box(0.046, 0.15, 0.02, new THREE.MeshStandardMaterial({ color: 0x1c1d1e, roughness: 0.95 }), 0, -0.02, 0.40); // 床尾パッド

  // 機関部（下部・上部）
  box(0.058, 0.065, 0.22, black, 0, -0.012, -0.01);
  box(0.054, 0.058, 0.25, black, 0, 0.049, -0.015);
  box(0.004, 0.026, 0.08, steel, 0.029, 0.045, 0.0);      // 排莢口カバー（右側）
  cyl(0.008, 0.008, 0.03, steel, 0.031, 0.06, 0.07, 10);   // ボルト前進補助（右後ろ）
  box(0.05, 0.012, 0.02, black, 0, 0.083, 0.11);           // 槓桿（チャージングハンドル）
  box(0.066, 0.03, 0.10, black, 0, -0.058, -0.075);        // 弾倉の差込口

  // 弾倉（20発）
  box(0.03, 0.165, 0.078, poly, 0, -0.145, -0.07, 0.07);
  box(0.034, 0.012, 0.084, poly, 0, -0.226, -0.064, 0.07);

  // 握り（グリップ）と用心金・引き金
  box(0.032, 0.115, 0.045, poly, 0, -0.085, 0.07, -0.33);
  box(0.012, 0.006, 0.075, black, 0, -0.062, 0.018);
  box(0.004, 0.022, 0.006, steel, 0, -0.05, 0.02, 0.2);

  // ハンドガード（八角形・フリーフロート）と側面のレール
  const hg = cyl(0.046, 0.046, 0.42, black, 0, 0.03, -0.35, 8); hg.rotation.y = Math.PI / 8;
  for (const sx of [-1, 1]) box(0.008, 0.018, 0.40, black, sx * 0.047, 0.03, -0.35);
  box(0.018, 0.008, 0.40, black, 0, -0.019, -0.35);

  // 上面のピカティニーレール（溝付き）
  box(0.022, 0.008, 0.66, black, 0, 0.082, -0.23);
  const notch = new THREE.InstancedMesh(new THREE.BoxGeometry(0.023, 0.005, 0.0053), black, 66);
  const mm = new THREE.Matrix4();
  for (let i = 0; i < 66; i++) { mm.makeTranslation(0, 0.088, 0.095 - i * 0.01); notch.setMatrixAt(i, mm); }
  g.add(notch);

  // 銃身・消炎器・消音器
  cyl(0.0115, 0.0115, 0.16, steel, 0, 0.03, -0.64);
  cyl(0.014, 0.014, 0.04, steel, 0, 0.03, -0.735);
  cyl(0.021, 0.021, 0.20, black, 0, 0.03, -0.85, 20);
  cyl(0.019, 0.021, 0.012, steel, 0, 0.03, -0.954, 20);

  // 二脚（折りたたみ）
  for (const sx of [-1, 1]) cyl(0.005, 0.005, 0.22, steel, sx * 0.012, -0.03, -0.44, 8);
  box(0.035, 0.02, 0.03, black, 0, -0.03, -0.55);

  // スコープ（3.5-10倍・40mm）
  const sy = 0.132;
  for (const rz of [-0.04, -0.19]) { box(0.03, 0.04, 0.022, black, 0, 0.108, rz); }
  cyl(0.0152, 0.0152, 0.30, black, 0, sy, -0.12, 20);                 // 本体の筒
  cyl(0.0152, 0.026, 0.05, black, 0, sy, -0.295, 20);                // 対物側の広がり
  cyl(0.026, 0.026, 0.07, black, 0, sy, -0.355, 20);                 // 対物レンズ部
  cyl(0.024, 0.024, 0.002, glass, 0, sy, -0.391, 20);
  cyl(0.0152, 0.021, 0.04, black, 0, sy, 0.05, 20);                  // 接眼側
  cyl(0.021, 0.021, 0.06, black, 0, sy, 0.10, 20);
  cyl(0.019, 0.019, 0.002, glass, 0, sy, 0.131, 20);
  const tE = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.03, 18), black); tE.position.set(0, sy + 0.028, -0.11); g.add(tE); // 上下調整ダイヤル
  const tW = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.026, 18), black); tW.rotation.z = Math.PI / 2; tW.position.set(0.027, sy, -0.11); g.add(tW); // 左右調整ダイヤル
  box(0.024, 0.024, 0.04, black, 0, sy, -0.11);                       // ダイヤルの台座

  const range = Math.hypot(hit.point.x - b.o.x, hit.point.z - b.o.z);
  const milV = Math.atan2(up, fwd) * 1000, milH = Math.atan2(rt, fwd) * 1000;
  const v = Math.hypot(b.v[0], b.v[1], b.v[2]), J = 0.5 * BALL.mass * v * v;
  spawnPuff(hit.point.clone(), 0);
  playImpact(range / BALL.sound);
  const sg = x => (x >= 0 ? '+' : '−') + Math.abs(x);
  shotEl.hidden = false;
  shotEl.innerHTML =
    `着弾 <b>${range.toFixed(0)} m</b>（${hit.what}）` +
    `<div class="row">上下 ${sg(Math.round(up * 100))} cm（${sg(milV.toFixed(1))} ミル）</div>` +
    `<div class="row">左右 ${sg(Math.round(rt * 100))} cm（${sg(milH.toFixed(1))} ミル）</div>` +
    `<div class="row">飛行 ${b.t.toFixed(2)} 秒・${v.toFixed(0)} m/s・${(J / 1000).toFixed(1)} kJ</div>`;
}

function fire() {
  const now = performance.now() / 1000;
  if (S.reloading > 0) return;
  if (now - S.lastShot < 0.18) return;          // 半自動：1回押すたびに1発
  if (S.mag === 0) { playClick(0); return; }
  S.lastShot = now; S.mag--; updateAmmo();
  playShot();
  gun.userData.flash.material.opacity = 1;
  S.kick = 1;
  S.recoilV += S.aiming ? 0.11 : 0.16;          // 視点の跳ね上がり

  launchBullet();
  if (S.mag === 0 && S.reserve > 0) setTimeout(reload, 400);
}

// ---------- ループ ----------
const posEl = document.getElementById('pos');
const clock = new THREE.Clock();
const WALK = 4.0; // m/s
const lerpE = (a, b, t) => new THREE.Euler(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t);
let t0 = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05); t0 += dt;

  // 移動
  let mx = move.x, my = move.y;
  if (!S.aiming) { if (keys.KeyW) my -= 1; if (keys.KeyS) my += 1; if (keys.KeyA) mx -= 1; if (keys.KeyD) mx += 1; }
  const fwd = -my, right = mx, moving = Math.hypot(mx, my) > 0.05;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  camera.position.x += (right * cos - fwd * sin) * WALK * dt;
  camera.position.z += (-right * sin - fwd * cos) * WALK * dt;
  camera.position.x = Math.max(-11, Math.min(11, camera.position.x));
  camera.position.z = Math.max(-0.6, Math.min(6.5, camera.position.z));
  camera.position.y = EYE_H + 0.2;

  // リロード
  if (S.reloading > 0) {
    S.reloading -= dt;
    if (S.reloading <= 0) {
      const need = M110.magSize - S.mag, take = Math.min(need, S.reserve);
      S.mag += take; S.reserve -= take; S.reloading = 0; updateAmmo();
    }
  }

  // 反動（ばねで戻る）
  S.recoilV -= S.recoil * 90 * dt; S.recoilV *= Math.exp(-14 * dt);
  S.recoil += S.recoilV * dt * 10;
  S.kick *= Math.exp(-12 * dt);
  const fl = gun.userData.flash.material; fl.opacity *= Math.exp(-40 * dt);

  // スコープの出し入れ
  S.aimT += ((S.aiming ? 1 : 0) - S.aimT) * Math.min(1, dt * 12);
  const inScope = S.aimT > 0.92;
  scopeCv.hidden = !inScope; zoomBox.hidden = !inScope;
  crossEl.style.display = S.aimT > 0.2 ? 'none' : ''; helpEl.style.display = S.aimT > 0.2 ? 'none' : '';
  if (inScope) {
    camera.fov = scopeFovDeg() * (innerHeight / (2 * scopeRadiusPx()));
  } else {
    camera.fov = BASE_FOV - S.aimT * 20;
  }
  camera.updateProjectionMatrix();

  // 構えの揺れ（呼吸）。スコープ中は小さく、射撃台に依託しているので約0.15ミル
  const swayA = inScope ? 0.00015 : 0.0008;
  const swayX = Math.sin(t0 * 0.9) * swayA + Math.sin(t0 * 2.3) * swayA * 0.4;
  const swayY = Math.sin(t0 * 1.3 + 1) * swayA * 0.8;
  camera.rotation.set(pitch + S.recoil * 0.12 + swayY, yaw + swayX, 0);

  // 銃の位置（腰だめ ⇄ 構え）
  const bob = moving && !S.aiming ? Math.sin(t0 * 9) * 0.006 : 0;
  const rl = S.reloading > 0 ? Math.sin(Math.min(1, (2.6 - S.reloading) / 2.6) * Math.PI) : 0;
  gun.position.lerpVectors(HIP.pos, AIM.pos, S.aimT);
  gun.position.y += bob - rl * 0.12; gun.position.z += S.kick * 0.045;
  const r = lerpE(HIP.rot, AIM.rot, S.aimT);
  gun.rotation.set(r.x + S.kick * 0.05 + rl * 0.5, r.y, r.z - rl * 0.35);
  gun.visible = !inScope;

  updateWind(t0, dt);
  updateBullets(dt);

  // 土煙
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt;
    if (p.t < 0) continue;
    const k = p.t / 1.6;
    p.sp.material.opacity = Math.max(0, 0.9 * (1 - k));
    const sc = 1.2 + k * 3.5;
    p.sp.scale.setScalar(sc);
    p.sp.position.y = p.y0 + sc * 0.4 + k * 0.6;   // 地面に埋もれないよう持ち上げる
    if (k >= 1) { scene.remove(p.sp); p.sp.material.dispose(); puffs.splice(i, 1); }
  }

  posEl.textContent = `横 ${camera.position.x.toFixed(1)} m ／ 視線 ${((-yaw * 180 / Math.PI) % 360).toFixed(0)}°`;

  renderer.clear();
  renderer.render(scene, camera);
  if (gun.visible) { renderer.clearDepth(); renderer.render(gunScene, gunCam); }
  requestAnimationFrame(tick);
}
updateAmmo(); drawScope(); tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  gunCam.aspect = innerWidth / innerHeight; gunCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); drawScope();
});

// テスト用の入口
window.__game = { fire, toggleAim, setZoom, reload, S, gun, HIP, puffs, bullets, wind, ZERO_ANGLE, get yaw() { return yaw; }, set yaw(v) { yaw = v; }, get pitch() { return pitch; }, set pitch(v) { pitch = v; } };
</script>
